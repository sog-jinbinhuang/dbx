resources:
  jobs:
    report_send_weekly:
      name: report_send_weekly
      tasks:
        - task_key: send_weekly_reports
          environment_key: reports_env
          max_retries: 0
          notebook_task:
            notebook_path: ../reports/send_reports.py
            base_parameters:
              frequency_group: weekly
      environments:
        - environment_key: reports_env
          spec:
            environment_version: "1"
            dependencies:
              - databricks-sql-connector
              - openpyxl
      # Weekly stays on its own independent schedule (not chained to a
      # dedicated refresh run) -- send_reports.py's upstream_succeeded_today()
      # guard still checks that a daily refresh succeeded today before
      # sending, using whichever of daily_full_refresh_morning /
      # _afternoon last ran.
      schedule:
        quartz_cron_expression: "0 0 7 ? * MON"   # 7am America/New_York, Mondays
        timezone_id: "America/New_York"
        pause_status: PAUSED
      email_notifications:
        on_failure:
          - jhuang@mafcolicorice.com
