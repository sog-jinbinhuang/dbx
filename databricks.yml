# This is a Declarative Automation Bundle definition for dbx.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dbx
  uuid: cd59e36a-0532-440d-8569-f808186e323d

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The main analytics catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405617179633310.10.azuredatabricks.net
      profile: new-workspace
    variables:
      catalog: dev
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://adb-7405617179633310.10.azuredatabricks.net
      profile: new-workspace
      # We explicitly deploy to /Workspace/Users/jhuang@mafcolicorice.com to make sure we only have a single copy.
      root_path: /Workspace/Users/jhuang@mafcolicorice.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: prod
      schema: prod
    permissions:
      - user_name: jhuang@mafcolicorice.com
        level: CAN_MANAGE